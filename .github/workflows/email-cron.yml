name: Process Email Queue
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call API
        run: |
          curl -X GET "${{ secrets.APP_URL }}/api/cron/process-email-queue" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f
